##############################################################################
# Load test (JMeter) - local_stackmatheditor - twin of load-k6.yml
#
# Modes:
#   selfcontained (default): build a fresh Moodle + STACK + plugin site here,
#                            serve it and run the plan against it.
#   external:                point at a Moodle you already run (base_url).
#
# JMeter exits 0 even when every assertion failed. The result file is
# therefore evaluated separately (tests/load/check_jtl.py); only that step
# decides whether the run is green.
#
# Trigger: manual only (workflow_dispatch) - never on push, PR or merge.
# The "Run workflow" button needs this file on the DEFAULT branch (main); the
# branch to test is chosen in the dialog ("Use workflow from").
##############################################################################

name: Load test (JMeter)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'selfcontained (build + serve here) or external (your own site)'
        type: choice
        options: [selfcontained, external]
        default: selfcontained
        required: true
      base_url:
        description: '[external mode] Base URL of your Moodle (no trailing slash)'
        required: false
      threads:
        description: Concurrent threads
        default: '5'
        required: false
      rampup:
        description: Ramp-up seconds
        default: '5'
        required: false
      loops:
        description: Smoke iterations per thread
        default: '10'
        required: false
      load_threads:
        description: Concurrent students on the attempt page (at most 20 seeded)
        default: '10'
        required: false
      load_duration:
        description: Attempt load duration in seconds
        default: '60'
        required: false

defaults:
  run:
    shell: bash

env:
  JMETER_VERSION: '5.6.3'

jobs:
  jmeter:
    name: "JMeter smoke / ${{ inputs.mode || 'selfcontained' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      # Every value carries its own default (inputs are empty for API-triggered runs).
      MODE: ${{ inputs.mode || 'selfcontained' }}
      THREADS: ${{ inputs.threads || '5' }}
      RAMPUP: ${{ inputs.rampup || '5' }}
      LOOPS: ${{ inputs.loops || '10' }}
      LOAD_THREADS: ${{ inputs.load_threads || '10' }}
      LOAD_DURATION: ${{ inputs.load_duration || '60' }}
      EXTERNAL_BASE_URL: ${{ inputs.base_url }}
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
      - name: Set up PHP
        if: ${{ env.MODE == 'selfcontained' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
          # No xdebug/pcov: they disable the JIT and distort every timing measured here.
          coverage: none
      - name: Install Maxima and gnuplot (STACK CAS)
        if: ${{ env.MODE == 'selfcontained' }}
        run: |
          bash plugin/.github/install-maxima.sh
      - name: Build and install the test site (Moodle + STACK + plugin)
        if: ${{ env.MODE == 'selfcontained' }}
        run: bash plugin/.github/build-test-site.sh
      # Course, 20 students and "SME Load Quiz" (ten STACK questions on one page).
      - name: Seed test data
        if: ${{ env.MODE == 'selfcontained' }}
        run: |
          web=moodle; [ -d moodle/public ] && web=moodle/public
          php "$web/local/stackmatheditor/tests/playwright/seed.php" > /tmp/sme-seed.env \
            || { echo "Seed failed. Its output:"; cat /tmp/sme-seed.env; exit 1; }
          sed -n "s/^export \([A-Z_][A-Z0-9_]*\)='\(.*\)'$/\1=\2/p" /tmp/sme-seed.env >> "$GITHUB_ENV"
          cat /tmp/sme-seed.env
      - name: Set up JMeter
        run: |
          # Supply-chain hardening: verify the download against Apache's published SHA-512.
          # Two runs in a row ended here after fifteen minutes: the download from
          # archive.apache.org had stalled, and curl without a time limit waits for ever. The
          # mirror network comes first now, the archive is the fallback, and neither may take
          # longer than four minutes. The checksum always comes from apache.org itself.
          file="jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          fetch () { curl -fsSL --connect-timeout 20 --max-time 240 --retry 2 --retry-delay 5 "$1" -o "$2"; }
          fetch "https://dlcdn.apache.org/$file" jmeter.tgz \
            || fetch "https://archive.apache.org/dist/$file" jmeter.tgz \
            || { echo "::error::JMeter ${JMETER_VERSION} could not be downloaded from Apache."; exit 1; }
          fetch "https://downloads.apache.org/$file.sha512" jmeter.tgz.sha512 \
            || fetch "https://archive.apache.org/dist/$file.sha512" jmeter.tgz.sha512 \
            || { echo "::error::The JMeter checksum could not be downloaded from Apache."; exit 1; }
          # The .sha512 file already carries a filename; take the hash field only.
          echo "$(awk '{print $1}' jmeter.tgz.sha512)  jmeter.tgz" | sha512sum -c -
          tar xzf jmeter.tgz
      - name: Run the JMeter smoke plan
        run: |
          if [ "$MODE" = "external" ]; then
            if [ -z "$EXTERNAL_BASE_URL" ]; then
              echo "external mode needs base_url."
              exit 1
            fi
            base="$EXTERNAL_BASE_URL"
          else
            # The web server is started inside THIS step (see serve-test-site.sh).
            . plugin/.github/serve-test-site.sh
            base="$MOODLE_WWWROOT"
            # The first login in the life of this site, alone and before anything is measured
            # (see warm-up-site.sh). The last seeded student is not part of the load plans.
            bash plugin/.github/warm-up-site.sh "$base" \
              "$(printf 'sme_student%02d' "$SME_STUDENTS")" "$SME_USER_PASS" "$SME_LOAD_CMID"
          fi
          echo "Target: $base, threads: $THREADS, ramp-up: ${RAMPUP}s, loops: $LOOPS"
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n \
            -t plugin/tests/load/stackmatheditor-smoke.jmx \
            -Jbase_url="$base" \
            -Jthreads="$THREADS" \
            -Jrampup="$RAMPUP" \
            -Jloops="$LOOPS" \
            -l results.jtl \
            -j jmeter.log \
            -e -o jmeter-report
          # Load: students on the attempt page with ten STACK questions (needs the seed data).
          if [ "$MODE" = "selfcontained" ]; then
            "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n \
              -t plugin/tests/load/stackmatheditor-attempt.jmx \
              -Jbase_url="$base" \
              -Jload_cmid="$SME_LOAD_CMID" \
              -Juser_pass="$SME_USER_PASS" \
              -Jthreads="$LOAD_THREADS" \
              -Jrampup="$RAMPUP" \
              -Jduration="$LOAD_DURATION" \
              -l attempt-results.jtl \
              -j jmeter-attempt.log \
              -e -o jmeter-attempt-report
          fi
      - name: Evaluate the results (JMeter itself always exits 0)
        run: |
          python3 plugin/tests/load/check_jtl.py results.jtl
          if [ -f attempt-results.jtl ]; then
            python3 plugin/tests/load/check_jtl.py attempt-results.jtl
          fi
      - name: Show Moodle server log on failure
        if: ${{ failure() && env.MODE == 'selfcontained' }}
        run: tail -100 /tmp/moodle-server.log || true
      - name: Upload results and HTML dashboard
        if: ${{ always() }}
        # A failed artifact upload must not fail a job whose checks passed: the finalize call
        # has answered 403 on an otherwise green run (2026-09-14). The logs are a convenience,
        # not a gate.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jmeter-results
          path: |
            results.jtl
            jmeter.log
            jmeter-report
            attempt-results.jtl
            jmeter-attempt.log
            jmeter-attempt-report
          retention-days: 7
          if-no-files-found: ignore
